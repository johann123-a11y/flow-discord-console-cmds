name: FlowDiscordConsoleCmds
version: "${project.version}"
main: dev.flowcmds.FlowDiscordConsoleCmds
api-version: "1.18"
load: STARTUP
description: Streams the full server console to Discord and runs console commands sent from Discord.
website: https://github.com/johann123-a11y/flow-discord-console-cmds
authors: [Flow]

commands:
  flowcmds:
    description: Show the link code, connection status, or reconnect to the bot
    usage: /flowcmds <status|code|reconnect|reload|reset>
    permission: flowcmds.admin

permissions:
  flowcmds.admin:
    description: Use /flowcmds
    default: op
