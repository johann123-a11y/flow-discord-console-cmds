# ============================================================
#  FlowDiscordConsoleCmds - your server console, live in Discord
# ============================================================
#
#  1. In the Discord channel that should become the console run:  /link
#  2. Enter the code you get here:  /flowcmds link <code>
#  Done: every console line shows up there, and /console <command> runs commands.

bot-url: "ws://178.105.194.236/mc"

# Name shown in Discord for this server
server-name: "My Minecraft Server"

# ---------- Commands from Discord ----------

# false = Discord can only watch the console, not run commands
allow-commands: true

# Commands that can NOT be run from Discord (without "/").
# Also blocks them inside "execute ... run <command>" and under every alias of a plugin
# command (blocking "lp" also blocks "luckperms"). Best effort - for full safety use allow-commands: false.
# Example: ["op", "deop", "lp"]
blocked-commands: []

# Write "[Discord] <user> issued server command: /<command>" into the console, like Paper does for players
log-command-usage: true

# Keep an audit file of every command from Discord (who, what, result):
# plugins/FlowDiscordConsoleCmds/commands.log
command-log-file: true

# ---------- What is streamed ----------
# Everything the real console shows - from the very first startup line
# (lines printed before the plugin loaded are read back from logs/latest.log).

# Keep plugin colors (§a, §c, ANSI ...) as colors in Discord, like a colored console
console-colors: true

# Lowest level that is sent: INFO, WARN or ERROR (DEBUG/TRACE also possible)
min-level: INFO

# Include full stack traces of errors
include-stacktraces: true

# Replace IP addresses with "x.x.x.x" (player login lines contain IPs!)
hide-ips: true

# Lines matching any of these regular expressions are NOT sent
ignore-patterns:
# - "^Can't keep up!.*"
  - ".*issued server command: /login .*"
  - ".*issued server command: /register .*"

# Lines buffered while the bot is unreachable (oldest are dropped above this)
max-queued-lines: 5000

# How often player count / TPS / RAM are sent to the bot (for /status), in seconds
status-interval-seconds: 30
